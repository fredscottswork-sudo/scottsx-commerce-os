# ScottsTechX — Render Blueprint
#
# One file, one deploy: Render reads this from the repo root and creates
# everything the product needs.
#
#   1. scottstechx-db   — managed Postgres
#   2. scottstechx-api  — the Fastify backend in 12_Backend (Node)
#   3. scottstechx-web  — the React site in web (static)
#
# The two services are wired to each other automatically. The web build is
# handed the API's URL (VITE_API_URL) and the API is handed the site's URL
# (PUBLIC_WEB_URL), so there is no copy-paste step and no way to get a
# mismatch between them. That second one is not cosmetic: verification and
# password-reset emails link to <PUBLIC_WEB_URL>/verify-email?token=…, and
# /sitemap.xml refuses to emit guessed absolute URLs without it.
#
# Deploy:  Dashboard → New → Blueprint → select this repo.
# Docs:    https://render.com/docs/blueprint-spec
#
# Render prompts for every value marked `sync: false` on the first deploy.
# JWT_SECRET is generated for you, so the repository's public dev default
# ("dev-secret-change-me") can never reach production.

databases:
  - name: scottstechx-db
    databaseName: scottstechx
    user: scottstechx
    region: frankfurt
    # NOTE: Render's `free` Postgres EXPIRES 30 DAYS after creation, has no
    # backups and no restore. After expiry there is a short grace period and
    # then the database and all of its data are deleted.
    # For anything you intend to keep, change this to `basic-256mb`, or delete
    # this whole `databases:` block and point DATABASE_URL at an external
    # Postgres (Neon / Supabase) instead.
    plan: free
    ipAllowList: [] # private network only — nothing outside can reach it

services:
  # ── Backend API ────────────────────────────────────────────────────────────
  - type: web
    name: scottstechx-api
    runtime: node
    region: frankfurt # must match the database region for private networking
    plan: free
    rootDir: 12_Backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    # Proof of more than "the process is up": this endpoint only answers
    # {"ready":true,…} once the 5 MB offline gazetteer has been shipped and
    # loaded, which is what reverse-geocoding every store pin depends on.
    healthCheckPath: /api/v1/geo/status
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '22'

      - key: NODE_ENV
        value: production

      # Migrations run on boot unless RUN_MIGRATIONS is explicitly "false".
      # Setting DATABASE_URL also skips the embedded Postgres that local dev
      # uses, so the container starts against this database and nothing else.
      - key: RUN_MIGRATIONS
        value: 'true'

      # Wired automatically from the database above. To use an external
      # Postgres instead, replace these three lines with:
      #   - key: DATABASE_URL
      #     sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: scottstechx-db
          property: connectionString

      # Signs every login token. Generated by Render, so the repo's public
      # default can never reach production.
      - key: JWT_SECRET
        generateValue: true

      # Canonical public address of the WEB app (not this API).
      # Wired from the web service's own external URL rather than prompted,
      # because "remember to set this later" is how verification links end up
      # pointing at the wrong host.
      - key: PUBLIC_WEB_URL
        fromService:
          name: scottstechx-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL

      # ── First-boot accounts ───────────────────────────────────────────────
      # Render prompts for these. If ADMIN_PASSWORD is left empty the code
      # falls back to "Admin123!", which is published in this repository — so
      # set a real one.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # "false" = start with a real, empty marketplace (recommended).
      # "true"  = insert 6 demo sellers and 24 demo products so there is
      #           something to browse immediately. Fine for a demo, wrong for
      #           a live store. Flip it and redeploy at any time.
      - key: SEED_DATABASE
        value: 'false'

      # ── Optional integrations ─────────────────────────────────────────────
      # Each stays dormant while unset; nothing breaks without them.
      #   GOOGLE_CLIENT_ID  — enables Google Sign-In. Also add the web origin
      #                       under Authorised JavaScript origins in the Google
      #                       Cloud console, or the button loads and then
      #                       refuses with origin_mismatch.
      - key: GOOGLE_CLIENT_ID
        sync: false

      # AI. With no key the catalogue-grounded local engine answers; it is the
      # same path the test suite exercises. Adding a key swaps in an LLM.
      #   AI_PROVIDER       — "openrouter" (default) or "apifreellm"
      #   LLM_API_KEY       — OpenRouter key (AI_PROVIDER=openrouter)
      #   APIFREELLM_API_KEY— apifreellm key (AI_PROVIDER=apifreellm)
      #   AI_MODEL          — default meta-llama/llama-3.3-70b-instruct
      #   AI_VISION_MODEL   — default meta-llama/llama-3.2-11b-vision-instruct
      # Note: apifreellm's free tier refuses datacenter IPs, so on Render use
      # AI_PROVIDER=openrouter with an LLM_API_KEY.
      - key: AI_PROVIDER
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: APIFREELLM_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: AI_VISION_MODEL
        sync: false

      # Roboflow vision AI (server-side only — never add to web build vars).
      # When set, listing photos are reviewed on submit: approved → publishes,
      # manual_review → admin queue, rejected/needs_better_image → blocked
      # with the workflow's reasons. The same workflow labels photos for image
      # search + AI listing generation, and its embedding powers visual search.
      #   ROBOFLOW_WORKFLOW_URL  — defaults to the active-learning workflow
      #   ROBOFLOW_TIMEOUT_MS    — default 10000
      - key: ROBOFLOW_API_KEY
        sync: false
      - key: ROBOFLOW_WORKFLOW_URL
        sync: false
      - key: ROBOFLOW_TIMEOUT_MS
        sync: false

      # NVIDIA NIM vision captions — names whatever is in a photo, alongside
      # Roboflow's moderation labels. Server-side ONLY.
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_BASE_URL
        sync: false
      - key: NVIDIA_MODEL
        sync: false
      - key: NVIDIA_VISION_MODEL
        sync: false
      - key: NVIDIA_ENABLE_THINKING
        sync: false
      - key: NVIDIA_TIMEOUT_MS
        sync: false

      # Public origin of THIS API if it differs from the request host (custom
      # domain). Used to build absolute photo URLs for Roboflow.
      - key: PUBLIC_API_URL
        sync: false

      # ── Verification email (SMTP) ─────────────────────────────────────────
      # Sign-in codes are emailed through this account.
      #   SMTP_PORT 465 = implicit TLS, 587 = STARTTLS (both supported).
      #   Gmail/Zoho need an APP password, not the account password.
      #   MAIL_FROM must be an address the provider allows you to send as.
      # Diagnose at GET /api/v1/mail/status (shows the last SMTP error).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '465'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false

  # ── Web app (static) ───────────────────────────────────────────────────────
  - type: web
    name: scottstechx-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist # relative to rootDir
    autoDeploy: true
    envVars:
      # Points the site at the API above, resolved at build time. Do NOT append
      # /api/v1 — the client adds it (web/src/api/client.ts).
      - key: VITE_API_URL
        fromService:
          name: scottstechx-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

      # SITE_URL is deliberately NOT set. The sitemap generator falls back to
      # RENDER_EXTERNAL_URL, which Render injects into this build, so the
      # sitemap is correct with no configuration. Add SITE_URL in the dashboard
      # when you attach a custom domain — that is the origin Google should
      # index and the one buyers should see in email.

      # Optional: paste your Google OAuth client id to show the Google button.
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false

    # Single-page app: every unmatched path must serve index.html, or a hard
    # refresh on /nearby or /product/<id> returns 404.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
