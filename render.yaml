# ScottsTechX — Render Blueprint
#
# Creates three resources in one go:
#   1. scottstechx-db   — Postgres
#   2. scottstechx-api  — the Fastify backend (Node)
#   3. scottstechx-web  — the React site (static)
#
# The web app is wired to the API automatically (see VITE_API_URL below), so
# there is no URL to copy between steps.
#
# On the first sync Render prompts you for the values marked `sync: false`.
# JWT_SECRET is generated for you — never reuse the repo's dev default.
#
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: scottstechx-db
    databaseName: scottstechx
    user: scottstechx
    region: frankfurt
    # NOTE: `free` Postgres EXPIRES 30 DAYS after creation, has no backups, and
    # is limited to one per workspace. After expiry you get a 14-day grace
    # period, then Render deletes it and all its data.
    # For anything you care about, change this to `basic-256mb` (paid), or
    # delete this whole `databases:` block and instead set DATABASE_URL to an
    # external Postgres (Neon/Supabase) by switching it to `sync: false` below.
    plan: free
    ipAllowList: [] # private network only — nothing external can reach it

services:
  # ── Backend API ───────────────────────────────────────────────────────────
  - type: web
    name: scottstechx-api
    runtime: node
    region: frankfurt # must match the database region for private networking
    plan: free
    rootDir: 12_Backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    # Proves the app booted AND that the 5MB offline gazetteer shipped:
    # this endpoint answers {"ready":true,...} only when the asset is present.
    healthCheckPath: /api/v1/geo/status
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: '22'

      - key: NODE_ENV
        value: production

      # Wired automatically from the database above. To use an external
      # Postgres instead (Neon/Supabase), replace these three lines with:
      #   - key: DATABASE_URL
      #     sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: scottstechx-db
          property: connectionString

      # Signs every login token. Generated by Render, so the repo's public
      # default ("dev-secret-change-me") can never reach production.
      - key: JWT_SECRET
        generateValue: true

      # Canonical public address of the WEB app (not this API).
      #
      # REQUIRED for email verification links: the verification email links to
      # <PUBLIC_WEB_URL>/verify-email?token=... and without this the server can
      # only fall back to emailing a six-digit code.
      #
      # /sitemap.xml also needs it to emit absolute <loc> URLs, and returns 503
      # without it rather than advertising links to a guessed domain.
      #
      # Wired from the web service's own external URL rather than prompted.
      # Leaving it unset broke verification links (they fell back to a
      # hardcoded host) and made /sitemap.xml return 503, and "you must
      # remember to set this" is exactly the kind of step that gets missed.
      #
      # fromService has no 'url' property, but envVarKey can copy another
      # service's RENDER_EXTERNAL_URL, which is the https origin Render serves
      # that service from.
      #
      # Override it in the dashboard once you have a custom domain — that is
      # the origin Google should index and the one users should see in email.
      - key: PUBLIC_WEB_URL
        fromService:
          name: scottstechx-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL

      # Render prompts for these on the first sync. If you leave ADMIN_PASSWORD
      # empty the code falls back to "Admin123!", which is published in this
      # repo — so set a real one.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # "false" = start with a real, empty marketplace (recommended).
      # "true"  = insert 6 demo sellers and 24 demo products so there is
      #           something to browse immediately. Fine for a demo, wrong for
      #           a real store. You can flip this later and redeploy.
      - key: SEED_DATABASE
        value: 'false'

      # ── Optional integrations ───────────────────────────────────────────
      # Each stays dormant while unset; nothing breaks.
      #   GOOGLE_CLIENT_ID     — enables Google Sign-In (also add the web
      #                          origin under Authorised JavaScript origins
      #                          in the Google Cloud console)
      #   LLM_API_KEY          — swaps the built-in catalogue AI for an LLM
      #   NYLON_PAY_API_KEY    — enables card/mobile-money; until then
      #   NYLON_PAY_API_SECRET   cash-on-delivery is the only checkout path
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: NYLON_PAY_API_KEY
        sync: false
      - key: NYLON_PAY_API_SECRET
        sync: false

      # ── Verification email (SMTP) ───────────────────────────────────────
      # REQUIRED for email/password sign-up.
      #
      # Sign-up always requires a 6-digit code so a fake address cannot become
      # an account. Without a mailer the server cannot send that code — and it
      # will NOT fall back to returning the code in the API response, because
      # anyone could then verify an address they do not own. Instead,
      # email/password sign-up is refused with 503 until these are set.
      #
      # Google sign-in keeps working without them (Google proves the address),
      # so the site stays usable while you configure this.
      #
      # Any SMTP provider works (Zoho, Brevo, Mailgun, Gmail app password…).
      # Port 465 is implicit TLS, which is what the sender speaks.
      #   MAIL_FROM format: ScottsTechX <no-reply@yourdomain.com>
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '465'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false

  # ── Web app (static) ──────────────────────────────────────────────────────
  - type: web
    name: scottstechx-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist # relative to rootDir
    autoDeployTrigger: commit
    envVars:
      # Points the site at the API above, resolved at build time. Do NOT append
      # /api/v1 — the client adds it (web/src/api/client.ts).
      - key: VITE_API_URL
        fromService:
          name: scottstechx-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

      # SITE_URL is deliberately NOT set here. The sitemap generator already
      # falls back to RENDER_EXTERNAL_URL, which Render injects into this
      # build, so the sitemap is correct with no configuration. Add SITE_URL in
      # the dashboard when you attach a custom domain - that is the origin
      # Google should index.

      # Optional: paste your Google OAuth client id to show the Google button.
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false

    # Single-page app: every unmatched path must serve index.html, or a hard
    # refresh on /nearby returns 404.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
