name: Android release APK

# Builds an installable release APK pointed at your live API.
#
# Optional repository secrets (Settings > Secrets and variables > Actions):
#   API_BASE_URL            e.g. https://api.yourdomain.com/api/v1  (must end /api/v1)
#                           Defaults to the deployed Render API when unset.
#   ANDROID_KEYSTORE_BASE64 base64 of your .jks  (base64 -w0 release.jks)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#
# Without the keystore secrets the build still succeeds but is debug-signed,
# which is fine for internal testing and NOT acceptable for the Play Store.
on:
  workflow_dispatch:
    inputs:
      apiBaseUrl:
        description: 'API base URL (overrides the API_BASE_URL secret)'
        required: false
        type: string
  push:
    tags: ['v*']

jobs:
  release-apk:
    runs-on: ubuntu-latest

    # Secrets are not available in step-level `if:`, so surface the one boolean
    # we need to branch on as an env var here.
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'yes' || 'no' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # Install the exact platform the app compiles against. Without this the
      # build can fail during early configuration/metadata tasks before any
      # source is compiled, which produces a failure with no compiler output.
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;34.0.0" "platform-tools"
          echo "--- installed platforms ---"
          ls "$ANDROID_SDK_ROOT/platforms" || true

      - name: Resolve the API base URL
        id: api
        env:
          # Passed through the environment rather than interpolated into the
          # script, so a value containing shell metacharacters cannot execute.
          INPUT_URL: ${{ inputs.apiBaseUrl }}
          SECRET_URL: ${{ secrets.API_BASE_URL }}
          DEFAULT_URL: https://scottstechx-api.onrender.com/api/v1
        run: |
          # Precedence: manual input > repository secret > the deployed API.
          #
          # This used to hard-fail when the secret was unset, so the very first
          # run of the workflow could never succeed - you had to know to create
          # a secret before pressing the button. The app's own Gradle default
          # is the emulator loopback (10.0.2.2), which is worse than useless in
          # a shipped APK, so falling through to THAT would be wrong. Falling
          # through to the real deployed API matches what the web client
          # already does, and is announced in the log so nobody ships against
          # the wrong backend by accident.
          URL="${INPUT_URL:-$SECRET_URL}"
          if [ -z "$URL" ]; then
            URL="$DEFAULT_URL"
            echo "::warning::API_BASE_URL is not set — building against the default: $URL"
          fi
          case "$URL" in
            https://*) ;;
            *) echo "::error::API_BASE_URL must be https:// — a shipped app cannot use cleartext."; exit 1 ;;
          esac
          case "$URL" in
            */api/v1) ;;
            *) echo "::error::API_BASE_URL must end with /api/v1 (got: $URL)"; exit 1 ;;
          esac
          echo "Building APK against: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Decode the signing keystore
        if: env.HAS_KEYSTORE == 'yes'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "${RUNNER_TEMP}/release.jks"
          test -s "${RUNNER_TEMP}/release.jks" || { echo "::error::Keystore decoded to an empty file — is the secret valid base64?"; exit 1; }
          echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        id: build
        working-directory: scottsx-android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # The previous two runs failed with the real message hidden: GitHub's web
        # log view truncates long output, and the failing task printed past the
        # cut. So the error is now captured three ways that CANNOT be truncated:
        #   1. the full log is uploaded as a downloadable artifact (always),
        #   2. the error lines are written to the job SUMMARY page,
        #   3. the tail is echoed last so it survives at the bottom of the log.
        run: |
          set -o pipefail
          chmod +x ./gradlew
          set +e
          ./gradlew --no-daemon --stacktrace assembleRelease \
            -PapiBaseUrl="${{ steps.api.outputs.url }}" 2>&1 | tee "${RUNNER_TEMP}/build.log"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo "## Android build failed (exit $status)"
              echo ""
              echo "### Error lines"
              echo '```'
              grep -aE "^e: |error:|FAILURE:|What went wrong|Caused by:|Could not|Execution failed|^\* " \
                "${RUNNER_TEMP}/build.log" | head -80
              echo '```'
              echo "### Last 80 lines"
              echo '```'
              tail -n 80 "${RUNNER_TEMP}/build.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            echo "=================== FAILURE SUMMARY ==================="
            grep -aE "^e: |error:|FAILURE:|What went wrong|Caused by:|Could not|Execution failed|^\* " \
              "${RUNNER_TEMP}/build.log" | head -80
            echo "=================== LAST 80 LINES ====================="
            tail -n 80 "${RUNNER_TEMP}/build.log"
            echo "======================================================="
          fi
          exit $status

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: warn

      # Prove the APK is a real, parseable, signed package BEFORE it ships.
      # "There was a problem parsing the package" on the phone can mean a
      # corrupt APK, a minSdk higher than the device, or (most often) that the
      # ZIP was installed instead of the APK inside it. This step rules out the
      # first two by inspecting the actual artifact.
      - name: Verify the APK is installable
        working-directory: scottsx-android
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$APK" || { echo "::error::No APK was produced."; exit 1; }
          echo "APK: $APK  ($(du -h "$APK" | cut -f1))"

          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"

          # 1. Is it a valid zip/APK container at all?
          unzip -t "$APK" > /dev/null || { echo "::error::APK is corrupt."; exit 1; }
          echo "container OK"

          # 2. Read the manifest. If aapt cannot parse it, neither can Android.
          "$BT/aapt2" dump badging "$APK" > /tmp/badging.txt \
            || { echo "::error::aapt2 could not parse the APK manifest."; exit 1; }
          grep -E "^package:|sdkVersion|targetSdkVersion" /tmp/badging.txt

          MIN=$(sed -n "s/^sdkVersion:'\([0-9]*\)'/\1/p" /tmp/badging.txt)
          echo "minSdk = $MIN"
          if [ -n "$MIN" ] && [ "$MIN" -gt 30 ]; then
            echo "::warning::minSdk $MIN excludes many devices."
          fi

          # 3. Is it actually signed? An unsigned APK will not install.
          "$BT/apksigner" verify --print-certs "$APK" \
            || { echo "::error::APK signature is invalid - it will not install."; exit 1; }
          echo "signature OK"

          {
            echo "## APK ready"
            echo ""
            grep -E "^package:" /tmp/badging.txt || true
            echo ""
            echo "**minSdk $MIN** - installs on Android $( [ "$MIN" -le 24 ] && echo '7.0' || echo "API $MIN" ) and newer."
            echo ""
            echo "### Installing it"
            echo "GitHub wraps every artifact in a ZIP. The download is"
            echo "\`scottsx-release-apk.zip\` - **unzip it first** and install the"
            echo "\`.apk\` inside. Installing the .zip itself gives"
            echo "\"There was a problem parsing the package\"."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report signing status
        run: |
          if [ "$HAS_KEYSTORE" = "yes" ]; then
            echo "APK is signed with your release key."
          else
            echo "::warning::No keystore supplied — this APK is DEBUG-SIGNED and cannot go to the Play Store."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: scottsx-release-apk
          path: scottsx-android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
