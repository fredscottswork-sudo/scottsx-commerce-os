name: Android release APK

# Builds an installable release APK pointed at your live API.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   API_BASE_URL            e.g. https://api.yourdomain.com/api/v1  (must end /api/v1)
#   ANDROID_KEYSTORE_BASE64 base64 of your .jks  (base64 -w0 release.jks)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#
# Without the keystore secrets the build still succeeds but is debug-signed,
# which is fine for internal testing and NOT acceptable for the Play Store.
on:
  workflow_dispatch:
    inputs:
      apiBaseUrl:
        description: 'API base URL (overrides the API_BASE_URL secret)'
        required: false
        type: string
  push:
    tags: ['v*']

jobs:
  release-apk:
    runs-on: ubuntu-latest

    # Secrets are not available in step-level `if:`, so surface the one boolean
    # we need to branch on as an env var here.
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'yes' || 'no' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve the API base URL
        id: api
        env:
          # Passed through the environment rather than interpolated into the
          # script, so a value containing shell metacharacters cannot execute.
          INPUT_URL: ${{ inputs.apiBaseUrl }}
          SECRET_URL: ${{ secrets.API_BASE_URL }}
        run: |
          URL="${INPUT_URL:-$SECRET_URL}"
          if [ -z "$URL" ]; then
            echo "::error::No API base URL. Set the API_BASE_URL secret or pass it to the workflow."
            exit 1
          fi
          case "$URL" in
            https://*) ;;
            *) echo "::error::API_BASE_URL must be https:// — a shipped app cannot use cleartext."; exit 1 ;;
          esac
          case "$URL" in
            */api/v1) ;;
            *) echo "::error::API_BASE_URL must end with /api/v1 (got: $URL)"; exit 1 ;;
          esac
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Decode the signing keystore
        if: env.HAS_KEYSTORE == 'yes'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "${RUNNER_TEMP}/release.jks"
          test -s "${RUNNER_TEMP}/release.jks" || { echo "::error::Keystore decoded to an empty file — is the secret valid base64?"; exit 1; }
          echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: scottsx-android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease -PapiBaseUrl="${{ steps.api.outputs.url }}"

      - name: Report signing status
        run: |
          if [ "$HAS_KEYSTORE" = "yes" ]; then
            echo "APK is signed with your release key."
          else
            echo "::warning::No keystore supplied — this APK is DEBUG-SIGNED and cannot go to the Play Store."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: scottsx-release-apk
          path: scottsx-android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
