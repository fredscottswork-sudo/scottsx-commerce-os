name: CI

# Type-checks and builds backend + web, then runs the real test suites against
# a real Postgres. Nothing here is mocked.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  backend-and-web:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: scottstechx
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U app -d scottstechx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Points the backend at the service container above, so the embedded
      # Postgres (a local-dev-only convenience) is never started in CI.
      DATABASE_URL: postgresql://app:***@127.0.0.1:5433/scottstechx
      JWT_SECRET: ci-test-secret-not-used-in-production
      PORT: '3001'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            12_Backend/package-lock.json
            web/package-lock.json

      - name: Install backend dependencies
        working-directory: 12_Backend
        run: npm ci

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Type-check and build backend
        working-directory: 12_Backend
        run: npm run build

      - name: Assert the gazetteer asset reached dist/
        working-directory: 12_Backend
        # tsc emits only .js. If this 5MB binary is missing, every geo endpoint
        # degrades to 503 at runtime — a failure that is invisible at build time.
        run: test -f dist/geo/gazetteer.bin

      - name: Type-check and build web
        working-directory: web
        run: npm run build

      - name: Start the API
        working-directory: 12_Backend
        run: |
          node dist/server.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:3001/api/v1/geo/status" >/dev/null 2>&1; then
              echo "API is up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "API failed to start"; cat /tmp/api.log; exit 1

      - name: Backend end-to-end suite
        working-directory: 12_Backend
        run: node tests/e2e.mjs

      - name: Google Sign-In suite
        working-directory: 12_Backend
        run: node tests/google-auth.mjs

      - name: Android/backend contract suite
        working-directory: 12_Backend
        run: node tests/android-contract.mjs

      - name: Web UI suite (real bundle in jsdom, real API)
        working-directory: web
        run: node tests/ui.mjs

      - name: API log on failure
        if: failure()
        run: cat /tmp/api.log || true

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        working-directory: scottsx-android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: scottsx-android
        # The app talks to whatever API_BASE_URL is baked in at build time.
        # Override with a real host for a shippable build (see the release job).
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: scottsx-debug-apk
          path: scottsx-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error